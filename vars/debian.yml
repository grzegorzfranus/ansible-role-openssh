---
# =============================================================================
# Ansible Role: OpenSSH - Debian Family Variables
# =============================================================================
# Internal constants for the Debian OS family, loaded by the first_found
# cascade in tasks/main.yml. Not intended to be overridden by users.
# =============================================================================

# Package names
openssh_packages:
  - openssh-server
  - openssh-client

# Service name
openssh_service_name: ssh
